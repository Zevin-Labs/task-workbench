name: CI

on:
  push:
    branches: [main]
  pull_request:

# 公开仓库：默认只读，防止工作流拿到多余写权限
permissions:
  contents: read

# 同一分支的旧运行在新提交后自动取消，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify (syntax + full test suite)
        run: npm run verify
      - name: Pack check (files whitelist)
        run: npm run pack:check
